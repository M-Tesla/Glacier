name: CI

on:
  push:
  pull_request:
  release:
    types: [published]

jobs:
  test:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: x86_64-linux
            os: ubuntu-latest
          - name: x86_64-macos
            os: macos-13
          - name: aarch64-macos
            os: macos-14
          - name: x86_64-windows
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: "0.16.0"

      - name: Windows deps
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-zstd mingw-w64-x86_64-zlib
          update: false

      - name: Windows library path
        if: runner.os == 'Windows'
        shell: bash
        run: |
          echo "LIBRARY_PATH=C:/msys64/mingw64/lib" >> "$GITHUB_ENV"
          echo "CPATH=C:/msys64/mingw64/include" >> "$GITHUB_ENV"

      - name: Test
        if: runner.os != 'Windows'
        run: zig build test

      - name: Build
        if: runner.os == 'Windows'
        run: zig build

      - name: fmt
        if: runner.os == 'Linux'
        run: zig fmt --check build.zig glacier_repl.zig src tools

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: "0.16.0"
      - run: zig build wasm

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: "0.16.0"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build lib
        run: |
          zig build -Doptimize=ReleaseFast -Dlib_only=true
          zig build -Doptimize=ReleaseFast fixtures
      - name: pytest
        run: |
          python3 -m pip install pytest
          python3 -m pip install bindings/python
          python3 -m pytest bindings/python/tests

  wheel:
    name: manylinux-${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            os: ubuntu-latest
            image: quay.io/pypa/manylinux_2_28_x86_64
          - arch: aarch64
            os: ubuntu-24.04-arm
            image: quay.io/pypa/manylinux_2_28_aarch64
    steps:
      - uses: actions/checkout@v4
      - name: Build manylinux wheel
        run: |
          docker run --rm \
            -v "$PWD":/src -w /src \
            ${{ matrix.image }} \
            bash bindings/python/ci_manylinux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-manylinux_2_28_${{ matrix.arch }}
          path: dist/*.whl
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test wheel
        run: |
          python3 -m pip install pytest dist/*.whl
          python3 -m pytest bindings/python/tests

  publish:
    needs: wheel
    if: github.event_name == 'release' && github.event.action == 'published'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          merge-multiple: true
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
